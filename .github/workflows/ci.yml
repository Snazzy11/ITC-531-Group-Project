name: ci

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.14", cache: pip}
      - name: Install Python dependencies # Run the python check but completely ignore pillow
        run: |
          grep -viE '^(pillow|pillow-heif)([<=>~!;\[]|[[:space:]]|$)' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Lint
        run: python -m ruff check app
      - name: Test
        working-directory: .
        # run: pytest tests/ -q --cov=app --cov-report=term-missing
        run: pytest tests/ -q --cov=app --cov-report=term-missing --cov-fail-under=30

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=min
          tags: app:${{ github.sha }}
      # "smoke test" to run the image with throwaway keys
      - name: Write throwaway settings
        run: |
          cat > .env.local <<EOF
          RABBITMQ_TAG=3.13.7-management-alpine
          BROKER_USER=ci
          BROKER_PASSWORD=$(openssl rand -hex 16)
          GRAFANA_USER=ci
          GRAFANA_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -hex 32)
          S3_ENDPOINT_URL=http://storage:9000
          S3_PUBLIC_ENDPOINT_URL=http://localhost:9000
          S3_BUCKET=seekr-ci
          AWS_DEFAULT_REGION=us-east-1
          AWS_ACCESS_KEY_ID=seekr
          AWS_SECRET_ACCESS_KEY=seekr-devonly
          ADMIN_DISPLAY_NAME=ci-admin
          ADMIN_PASSWORD=$(openssl rand -hex 16)
          EOF
      - name: Start the stack
        run: |
          docker compose --env-file .env.local up -d --build --wait --wait-timeout 180 gateway app
          docker compose --env-file .env.local up -d --build matching_worker image_worker logger notifier
      - name: Smoke test
        run: |
          set -a; . ./.env.local; set +a
          scripts/smoke_test.sh
      - name: Show service logs
        if: failure()
        run: docker compose --env-file .env.local logs --no-color --tail 100
      - name: Stop the stack
        if: always()
        run: docker compose --env-file .env.local down --volumes
