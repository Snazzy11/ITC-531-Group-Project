upstream app_pool {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    location = /healthz { return 200 "Gateway OK!\n"; add_header Content-Type text/plain; }

    location /api/v1/ {
        proxy_pass http://app_pool/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs         { proxy_pass http://app_pool/docs;         proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://app_pool/openapi.json; proxy_set_header Host $host; }

    location / { return 404 '{"detail":"No route at the gateway."}'; add_header Content-Type application/json; }
}