name: campus-seekr

services:
  app:
    build: .
    expose: ["8000"]
    environment:
      BROKER_HOST: broker
      BROKER_USER: ${BROKER_USER:?set BROKER_USER in .env.local}
      BROKER_PASSWORD: ${BROKER_PASSWORD:?set BROKER_PASSWORD in .env.local}
      DATABASE_URL: "postgresql+psycopg2://seekr:seekr-devonly@db:5432/seekr"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

  matching_worker:
    build: .
    command: ["python", "-m", "app.matching_worker"]
    environment:
      BROKER_HOST: broker
      BROKER_USER: ${BROKER_USER:?set BROKER_USER in .env.local}
      BROKER_PASSWORD: ${BROKER_PASSWORD:?set BROKER_PASSWORD in .env.local}
    depends_on:
      broker:
        condition: service_healthy

  image_worker:
    build: .
    command: ["python", "-m", "app.image_worker"]
    environment:
      BROKER_HOST: broker
      BROKER_USER: ${BROKER_USER:?set BROKER_USER in .env.local}
      BROKER_PASSWORD: ${BROKER_PASSWORD:?set BROKER_PASSWORD in .env.local}
    depends_on:
      broker:
        condition: service_healthy

  logger:
    build: .
    command: ["python", "-m", "app.logger"]
    environment:
      BROKER_HOST: broker
      BROKER_USER: ${BROKER_USER:?set BROKER_USER in .env.local}
      BROKER_PASSWORD: ${BROKER_PASSWORD:?set BROKER_PASSWORD in .env.local}
    volumes: ["eventlogs:/app/logs"]
    depends_on:
      broker:
        condition: service_healthy

  notifier:
    build: .
    command: ["python", "-m", "app.notifier"]
    environment:
      BROKER_HOST: broker
      BROKER_USER: ${BROKER_USER:?set BROKER_USER in .env.local}
      BROKER_PASSWORD: ${BROKER_PASSWORD:?set BROKER_PASSWORD in .env.local}
    depends_on:
      broker:
        condition: service_healthy

  gateway:
    image: nginx:1.27.4-alpine
    ports: ["8081:80"]
    volumes: ["./gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]

  # Module 3 RabbitMQ setup, with milestone credentials and persistent storage.
  broker:
    image: rabbitmq:${RABBITMQ_TAG:?set RABBITMQ_TAG in .env.local (see README)}
    environment:
      RABBITMQ_DEFAULT_USER: ${BROKER_USER:?set BROKER_USER in .env.local (see README)}
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASSWORD:?set BROKER_PASSWORD in .env.local (see README)}
    ports: ["127.0.0.1:15672:15672"]
    volumes: ["brokerdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db:
    image: postgres:16.6-alpine3.20
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: seekr
      POSTGRES_PASSWORD: seekr-devonly
      POSTGRES_DB: seekr
    volumes:
      - seekr_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seekr -d seekr"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  brokerdata:
  eventlogs:
  seekr_data:
