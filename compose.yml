name: campus-seekr

services:
  app:
    build: .
    expose: ["8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway:
    image: nginx:1.27.4-alpine
    ports: ["8081:80"]
    volumes: ["./gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]